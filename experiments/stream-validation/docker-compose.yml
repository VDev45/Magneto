services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: magneto-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbit-config:/config
      - ./downloads:/downloads
