name: Stream validation

# Manual only. This is an experiment harness, not CI: it needs a torrent to
# download, a long-lived qBittorrent, and a human watching the stream. It must
# never run on push (PLAN.md §1: prove the streaming path before building).
on:
  workflow_dispatch:
    inputs:
      magnet:
        description: "Magnet to test. Leave blank to use the Sintel open-movie torrent."
        required: false
        default: ""
        type: string
      port:
        description: "Port for the console/API (port-forward this to your machine)."
        required: false
        default: "8000"
        type: string
# GitHub-hosted by design. The runner is disposable and has no inbound route,
# so the console is exposed through a temporary Cloudflare quick tunnel.

permissions:
  contents: read

# Do not let multiple validation runs share the same qBittorrent/download state.
concurrency:
  group: magneto-stream-validation
  cancel-in-progress: true

env:
  EXPERIMENT_DIR: experiments/stream-validation
  # Sintel (Blender Foundation open movie, CC-BY 3.0) -- freely distributable,
  # 123 MB, so a partial-download test completes quickly.
  # infohash is SHA1 of the bencoded info dict, NOT of the whole .torrent file.
  # Verified against https://webtorrent.io/torrents/sintel.torrent
  #   sha1(bencode(info)) = 08ada5a7a6183aae1e09d831df6748d566095a10
  MAGNET: magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fann&tr=udp%3A%2F%2Fopen.demonii.com%3A1337%2Fann&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fann&tr=udp%3A%2F%2Fexodus.desync.com%3A6969%2Fann

jobs:
  validate:
    # Hosted, not self-hosted. The download must happen on GitHub's network,
    # not on the maintainer's (deliberately slow) connection; the console is
    # reached back through a tunnel instead. A self-hosted runner would put
    # both back on the slow connection, which is what made the earlier
    # runs indistinguishable from running locally.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Fail fast on leftover state from a previous run
        run: |
          # Keep qbit-config/ so the WebUI password survives between runs --
          # wiping it makes qBittorrent mint a new temporary password every
          # run. The download tree is cleared explicitly instead.
          docker compose -f "$EXPERIMENT_DIR/docker-compose.yml" down --remove-orphans || true
          rm -rf "$EXPERIMENT_DIR/downloads"
          pkill -f "[u]vicorn console:app" || true
          pkill -f "[u]vicorn main:app" || true
          sleep 2

      - name: Ensure Docker is available
        run: |
          set -euo pipefail
          command -v docker
          command -v dockerd

          if ! docker info >/dev/null 2>&1; then
            echo "::notice::Docker daemon is down, attempting to start it."
            # Works only if this runner has passwordless sudo for the service.
            # Without it Actions cannot answer a sudo prompt -- the step would
            # hang rather than fail, so try it with a short non-interactive
            # timeout instead.
            if timeout 20 sudo -n systemctl start docker 2>/dev/null; then
              echo "started via systemctl"
            else
              echo "::error::Could not start Docker automatically."
              echo "Run this once in your own terminal, then re-run the workflow:"
              echo "  sudo systemctl enable --now docker"
              exit 1
            fi
          fi

          # The socket can lag a moment behind the service on systemd.
          for i in $(seq 1 15); do
            if docker info >/dev/null 2>&1; then
              echo "Docker ready after ${i}s"
              docker info --format 'Server {{.ServerVersion}} / {{.Driver}} / cgroup {{.CgroupDriver}}'
              exit 0
            fi
            sleep 1
          done
          echo "::error::Docker did not become ready in 15s"
          exit 1

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          command -v python3
          python3 -c 'import sys; assert sys.version_info >= (3,11), sys.version'
          python3 --version
          docker compose version
          command -v jq

      - uses: actions/checkout@v4

      # Use the runner's Python directly; this job runs on ubuntu-latest.
      # The 3.11 floor is asserted by the prerequisite check above.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r "$EXPERIMENT_DIR/requirements.txt"
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$EXPERIMENT_DIR" -t "$EXPERIMENT_DIR" -v

      - name: Resolve magnet
        id: magnet
        run: |
          if [ -n '${{ inputs.magnet }}' ]; then
            echo "value=${{ inputs.magnet }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$MAGNET" >> "$GITHUB_OUTPUT"
          fi

      - name: Start qBittorrent
        run: |
          set -euo pipefail
          # Docker Hub caps anonymous pulls per source IP, and hosted runners
          # share one IP across every user of Actions, so the budget is
          # routinely already spent before this job starts. The failure looks
          # like a network error: "error pulling image configuration: download
          # failed after attempts=1: toomanyrequests ... allowed: 44000/minute".
          # The window is per-minute, so backing off clears it -- do not treat
          # one failure as fatal.
          pulled=0
          for attempt in $(seq 1 8); do
            if docker compose -f "$EXPERIMENT_DIR/docker-compose.yml" pull -q; then
              pulled=1
              break
            fi
            echo "::warning::image pull throttled by Docker Hub (attempt $attempt/8)"
            sleep $((attempt * 20))
          done
          if [ "$pulled" -ne 1 ]; then
            echo "::error::Could not pull the qBittorrent image after 8 attempts."
            echo "This is Docker Hub's anonymous rate limit, not a config error."
            echo "Re-run the workflow, or repoint the image at a mirror."
            exit 1
          fi

          echo "::group::qBittorrent container status"
          docker compose -f "$EXPERIMENT_DIR/docker-compose.yml" ps
          echo "::endgroup::"
          echo "Starting qBittorrent..."
          docker compose -f "$EXPERIMENT_DIR/docker-compose.yml" up -d
          echo "waiting for WebUI..."
          up=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              echo "qBittorrent WebUI up after ${i}s"
              up=1
              break
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::WebUI never answered on 8080."
            docker ps -a --filter name=magneto-qbittorrent
            docker logs --tail 40 magneto-qbittorrent || true
            exit 1
          fi
          echo "::group::qBittorrent startup diagnostics"
          docker ps --filter name=magneto-qbittorrent
          docker inspect --format 'image={{.Config.Image}} status={{.State.Status}} started={{.State.StartedAt}}' magneto-qbittorrent
          echo "::endgroup::"

      - name: Resolve qBittorrent password
        id: qbit
        run: |
          set -euo pipefail
          # qBittorrent generates a random password only on first start. The
          # config lives in qbit-config/ which persists between runs, so once
          # set the log no longer contains it -- prefer an explicit override.
          if [ -n "${{ vars.QBIT_PASSWORD }}" ]; then
            echo "password=${{ vars.QBIT_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "source=repository variable vars.QBIT_PASSWORD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # qBittorrent logs: "... a temporary password is provided for this
          # session: <PASSWORD>". Anchor on "session:" -- a loose
          # [A-Za-z0-9]{8,} match returns the word "password" itself.
          pw=$(docker logs magneto-qbittorrent 2>&1 \
               | sed -n 's/.*session: *\([A-Za-z0-9~]\{6,\}\).*/\1/p' | head -1 || true)
          if [ -n "$pw" ]; then
            echo "password=$pw" >> "$GITHUB_OUTPUT"
            echo "source=container log (temporary password)" >> "$GITHUB_OUTPUT"
          else
            echo "password=adminadmin" >> "$GITHUB_OUTPUT"
            echo "source=FALLBACK DEFAULT -- login will 401, set vars.QBIT_PASSWORD" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify qBittorrent login
        env:
          PW: ${{ steps.qbit.outputs.password }}
        run: |
          set -euo pipefail
          # qBittorrent answers 200 "Ok." or 204 No Content on success and 403
          # on bad credentials. Never trust a stored password blindly -- it
          # goes stale whenever qBittorrent regenerates its config.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Referer: http://127.0.0.1:8080/" \
            -d "username=${QBIT_USERNAME:-admin}&password=$PW" \
            http://127.0.0.1:8080/api/v2/auth/login)
          echo "login HTTP $code (source: ${{ steps.qbit.outputs.source }})"
          if [ "$code" = "403" ]; then
            echo "::error::qBittorrent rejected the password -- the stored one is stale."
            echo "Delete vars.QBIT_PASSWORD to fall back to scraping the log."
            exit 1
          fi
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::Unexpected login response: HTTP $code"
            exit 1
          fi

      - name: Start the console API
        env:
          QBIT_PASSWORD: ${{ steps.qbit.outputs.password }}
          LOCAL_SAVE_PATH: ${{ github.workspace }}/experiments/stream-validation/downloads
        run: |
          set -euo pipefail
          mkdir -p "$LOCAL_SAVE_PATH"
          cd "$EXPERIMENT_DIR"
          nohup "$RUNNER_TEMP/venv/bin/python" -m uvicorn console:app \
            --host 0.0.0.0 --port "${{ inputs.port }}" \
            > "$RUNNER_TEMP/console.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/console.pid"
          echo "log: $RUNNER_TEMP/console.log"

      - name: Wait for the console
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:${{ inputs.port }}/console"; then
              echo "console up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "console failed to start:"; cat "$RUNNER_TEMP/console.log"; exit 1

      - name: Expose the console through a tunnel
        id: tunnel
        run: |
          set -euo pipefail
          # A hosted runner has no inbound route, so a tunnel is the only way
          # to reach the console. Quick tunnels need no account or token, which
          # also means anyone holding the URL can drive the console -- see the
          # warning in the job summary.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"

          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url "http://127.0.0.1:${{ inputs.port }}" \
            > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tunnel.pid"

          url=""
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
                   "$RUNNER_TEMP/tunnel.log" | head -1 || true)
            [ -n "$url" ] && break
            sleep 2
          done
          if [ -z "$url" ]; then
            echo "::error::Tunnel never published a URL:"
            cat "$RUNNER_TEMP/tunnel.log"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Console: $url/console"

          # Prove the tunnel forwards, rather than trusting the printed URL.
          # cloudflared logs the hostname before the edge is actually
          # routable, so the first attempt fails DNS resolution (curl exit 6).
          # `|| true` matters: under `set -e` a bare failing curl aborts the
          # step and the real reason is never printed.
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$url/console" || true)
            [ "$code" = "200" ] && break
            echo "::debug::tunnel self-check ${i}: ${code:-unreachable}"
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::error::Tunnel published a URL but never reached the console (last: ${code:-unreachable})."
            tail -20 "$RUNNER_TEMP/tunnel.log"
            exit 1
          fi
          echo "tunnel self-check: GET /console -> HTTP $code"

      - name: Start the magnet
        env:
          QBIT_PASSWORD: ${{ steps.qbit.outputs.password }}
          MAGNET_VALUE: ${{ steps.magnet.outputs.value }}
        run: |
          set -euo pipefail
          echo "[$(date -Is)] Submitting magnet -- resolves metadata, does not start downloading."
          echo "Magnet length: ${#MAGNET_VALUE} characters"
          # Keep the magnet in an environment variable instead of interpolating
          # it into shell/Python source. Tracker URLs and display names are
          # untrusted text and may contain shell-significant characters.
          python3 - <<'PY' > "$RUNNER_TEMP/task-body.json"
          import json
          import os
          print(json.dumps({"magnet": os.environ["MAGNET_VALUE"]}))
          PY

          # -f so an HTTP error fails the step. Plain curl exits 0 on a 500,
          # which previously let a failed task creation report as SUCCESS.
          curl -fsS -X POST "http://127.0.0.1:${{ inputs.port }}/tasks" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/task-body.json" \
            | tee "$RUNNER_TEMP/task.json" || {
            echo "::error::POST /tasks failed. Almost always a qBittorrent auth problem."
            echo "Set repository variable QBIT_PASSWORD and re-run."
            exit 1
          }
          echo
          echo "task.json written to $RUNNER_TEMP/task.json"
          echo "::group::Created task"
          jq '{id, hash, name, state, file_count: (.files | length), video_files: [.files[] | select(.is_video == true) | {index, name, size, progress}]}' "$RUNNER_TEMP/task.json"
          echo "::endgroup::"
      - name: Smoke test the console UI and Range layer
        run: |
          set -uo pipefail
          cd "$EXPERIMENT_DIR"
          # Asserts what browser devtools would show -- status codes, headers,
          # byte counts. It selects the video file, because that is the only
          # thing that puts bytes on disk to range over. Playback and seeking
          # stay human steps.
          out=$("$RUNNER_TEMP/venv/bin/python" smoke_test.py \
            --base-url "http://127.0.0.1:${{ inputs.port }}" \
            --video-timeout 180 2>&1) && rc=0 || rc=$?
          echo "$out"
          {
            echo "### Scripted console + Range smoke test"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Console/Range smoke test failed -- see the table above."
          fi
          exit "$rc"

      - name: Test summary
        run: |
          {
            echo "## Stream validation running"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Port | \`${{ inputs.port }}\` |"
            echo "| Console | \`http://localhost:${{ inputs.port }}/console\` |"
            echo "| API docs | \`http://localhost:${{ inputs.port }}/docs\` |"
            echo "| Runner | ${{ runner.name }} |"
            echo "| qBittorrent password source | ${{ steps.qbit.outputs.source }} |"
            echo "| Magnet | \`${{ steps.magnet.outputs.value }}\` |"
            echo
            echo "### Open the console"
            echo
            echo "[\`${{ steps.tunnel.outputs.url }}/console\`](${{ steps.tunnel.outputs.url }}/console)"
            echo
            echo "The tunnel exists because a GitHub-hosted runner has no inbound"
            echo "route. The download runs on GitHub's network; the stream still has"
            echo "to reach your browser, so playback is bounded by your own uplink."
            echo
            echo "> **No authentication.** Anyone with this URL can add magnets and"
            echo "> stream content through this runner until the job ends. Cancel the"
            echo "> run when you are done."
            echo
            echo "### What to check (PLAN.md §1)"
            echo "The smoke test already selected the video file for you, so the"
            echo "download is running. Remaining human steps:"
            echo "1. Task shows progress climbing in the console."
            echo "2. Player starts before 100%."
            echo "3. Copy the stream URL into VLC and seek forward/backward."
            echo
            echo "Step 3 is the real gate. Cancel this job when done."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold open for manual testing
        run: |
          set -euo pipefail
          task_id=$(jq -r '.id // empty' "$RUNNER_TEMP/task.json")
          [ -n "$task_id" ] || { echo "::error::No task ID found"; exit 1; }
          echo "Console: ${{ steps.tunnel.outputs.url }}/console"
          echo "Task:    $task_id"
          echo "Heartbeat every 15s: console + task + pieces + qBittorrent"

          heartbeat=0
          while true; do
            heartbeat=$((heartbeat + 1))
            now=$(date -Is)
            console_code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" "http://127.0.0.1:${{ inputs.port }}/console" || true)
            task_json=$(curl -fsS -m 10 "http://127.0.0.1:${{ inputs.port }}/tasks/$task_id" || true)
            state_json=$(curl -fsS -m 10 "http://127.0.0.1:${{ inputs.port }}/tasks/$task_id/state" || true)
            progress=$(printf "%s" "$task_json" | jq -r ".progress // 0" 2>/dev/null || echo 0)
            state=$(printf "%s" "$task_json" | jq -r ".state // \"unknown\"" 2>/dev/null || echo unknown)
            name=$(printf "%s" "$task_json" | jq -r ".name // \"unknown\"" 2>/dev/null || echo unknown)
            downloaded=$(printf "%s" "$state_json" | jq -r ".piece_states.downloaded // 0" 2>/dev/null || echo 0)
            downloading=$(printf "%s" "$state_json" | jq -r ".piece_states.downloading // 0" 2>/dev/null || echo 0)
            pending=$(printf "%s" "$state_json" | jq -r ".piece_states.not_downloaded // 0" 2>/dev/null || echo 0)
            total=$(printf "%s" "$state_json" | jq -r ".piece_states.total // 0" 2>/dev/null || echo 0)
            printf "[%s] #%03d console=%s state=%s progress=%6.2f%% pieces=%s/%s downloaded, %s active, %s pending torrent=\"%s\"\n" "$now" "$heartbeat" "$console_code" "$state" "$(awk "BEGIN {print ($progress + 0) * 100}")" "$downloaded" "$total" "$downloading" "$pending" "$name"
            printf "%s\n" "$task_json" > "$RUNNER_TEMP/last-task.json"
            printf "%s\n" "$state_json" > "$RUNNER_TEMP/last-state.json"
            sleep 15
          done
          echo "Manual hold ended because the workflow was cancelled or GitHub reached its job timeout."
      - name: Dump diagnostics
        if: always()
        run: |
          echo "::group::Final console log"
          tail -120 "$RUNNER_TEMP/console.log" || true
          echo "::endgroup::"
          echo "::group::Final tunnel log"
          tail -80 "$RUNNER_TEMP/tunnel.log" || true
          echo "::endgroup::"
          echo "::group::Final task state"
          cat "$RUNNER_TEMP/task.json" "$RUNNER_TEMP/last-task.json" "$RUNNER_TEMP/last-state.json" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::qBittorrent diagnostics"
          docker ps -a --filter name=magneto-qbittorrent
          docker stats --no-stream magneto-qbittorrent 2>/dev/null || true
          docker logs --tail 120 magneto-qbittorrent 2>&1 || true
          echo "::endgroup::"
          echo "::group::Files on disk"
          find "$EXPERIMENT_DIR/downloads" -maxdepth 3 -type f -printf "%p | %s bytes\n" 2>/dev/null | head -100 || true
          echo "::endgroup::"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magneto-validation-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/console.log
            ${{ runner.temp }}/tunnel.log
            ${{ runner.temp }}/task.json
            ${{ runner.temp }}/last-task.json
            ${{ runner.temp }}/last-state.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean up
        if: always()
        run: |
          # Tear the tunnel down first: once this stops, the public URL stops
          # resolving, which is the point -- the URL must not outlive the job.
          [ -f "$RUNNER_TEMP/tunnel.pid" ] && kill "$(cat "$RUNNER_TEMP/tunnel.pid")" 2>/dev/null || true
          pkill -f "[c]loudflared tunnel" || true
          [ -f "$RUNNER_TEMP/console.pid" ] && kill "$(cat "$RUNNER_TEMP/console.pid")" 2>/dev/null || true
          pkill -f "[u]vicorn console:app" || true
          # No -v: preserves qbit-config/ and therefore the WebUI password.
          docker compose -f "$EXPERIMENT_DIR/docker-compose.yml" down --remove-orphans || true